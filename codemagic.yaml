# Cloud build for the Anchored Verse iPhone and iPad app (codemagic.io).
# Each build: install → build the web app → copy it into the iOS project → compile → upload to TestFlight.
# The website on Vercel is not affected by anything in this file. The app has no account, no database and no purchases.
#
# Before the first build, in this order:
#  1. Apple Developer → Identifiers: App ID com.eloraradiance.anchoredverse (no extra capabilities needed).
#  2. App Store Connect → Apps: create the app "Anchored Verse" with that bundle ID.
#  3. Apple Developer → Profiles → +: an "App Store Connect" profile for this App ID, using the existing
#     Apple Distribution certificate (the one the other three apps use).
#  4. Codemagic → Code signing identities → iOS provisioning profiles: "Fetch profiles" and tick the new one.
#  5. Codemagic → Add application → this repository (anchoredverse), branch main, workflow "iOS to TestFlight".
# Without steps 3 and 4 the build stops at once with "No matching profiles found for bundle identifier …".

workflows:
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # The name given to the App Store Connect API key in Codemagic → Personal Account → Integrations.
      app_store_connect: Elora Radiance
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eloraradiance.anchoredverse
      node: 22
      xcode: latest
    scripts:
      - name: Build the web app
        script: |
          npm ci
          npm run build
      - name: Copy into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Give this build a new build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the iPhone app
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: internal testers get the build once Apple has processed it.
        submit_to_testflight: false
